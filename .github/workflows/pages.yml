name: Publish DigitalPick frontend
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Unpack complete source
        run: unzip -q digitalpick-source.zip -d source
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
        working-directory: source
      - run: npm run typecheck && npm run typecheck:worker && npm test && npm run check:secrets
        working-directory: source
      - run: npm run build:pages && npm run check:pages && npm run check:secrets
        working-directory: source
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_PUBLIC_AI_PROXY_URL: ${{ vars.AI_PROXY_URL }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: source/out-pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
